<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >반지름 2 배 → 넓이 4 배</text><circle cx="62.0" cy="146.0" r="26.0" fill="#4A7DBF" opacity="0.24"/><circle cx="62.0" cy="146.0" r="26.0" fill="none" stroke="#2E4A7D" stroke-width="1.8"/><line x1="62.0" y1="146.0" x2="88.0" y2="146.0" stroke="#1B2A4A" stroke-width="1.1" stroke-dasharray="3 3"/><text x="75.0" y="141.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >1</text><text x="62.0" y="190.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >반지름 1</text><text x="62.0" y="206.0" font-size="10.6" fill="#2E4A7D" text-anchor="middle" font-weight="800" >넓이 1</text><circle cx="160.0" cy="146.0" r="52.0" fill="#4A7DBF" opacity="0.24"/><circle cx="160.0" cy="146.0" r="52.0" fill="none" stroke="#2E4A7D" stroke-width="1.8"/><line x1="160.0" y1="146.0" x2="212.0" y2="146.0" stroke="#1B2A4A" stroke-width="1.1" stroke-dasharray="3 3"/><text x="186.0" y="141.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >2</text><text x="160.0" y="216.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >반지름 2</text><text x="160.0" y="232.0" font-size="10.6" fill="#2E4A7D" text-anchor="middle" font-weight="800" >넓이 4</text><circle cx="310.0" cy="146.0" r="78.0" fill="#4A7DBF" opacity="0.24"/><circle cx="310.0" cy="146.0" r="78.0" fill="none" stroke="#2E4A7D" stroke-width="1.8"/><line x1="310.0" y1="146.0" x2="388.0" y2="146.0" stroke="#1B2A4A" stroke-width="1.1" stroke-dasharray="3 3"/><text x="349.0" y="141.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >3</text><text x="310.0" y="242.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >반지름 3</text><text x="310.0" y="258.0" font-size="10.6" fill="#2E4A7D" text-anchor="middle" font-weight="800" >넓이 9</text><rect x="428.0" y="56.0" width="238.0" height="156.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="448.0" y="84.0" font-size="12.6" fill="#1B2A4A" text-anchor="start" font-weight="800" >넓이 = π r²</text><text x="448.0" y="116.0" font-size="9.8" fill="#5A6779" text-anchor="start" font-weight="400" >반지름 1 배</text><text x="656.0" y="116.0" font-size="10.4" fill="#2E4A7D" text-anchor="end" font-weight="800" >넓이 1 배</text><text x="448.0" y="144.0" font-size="9.8" fill="#5A6779" text-anchor="start" font-weight="400" >반지름 2 배</text><text x="656.0" y="144.0" font-size="10.4" fill="#2E4A7D" text-anchor="end" font-weight="800" >넓이 4 배</text><text x="448.0" y="172.0" font-size="9.8" fill="#5A6779" text-anchor="start" font-weight="400" >반지름 3 배</text><text x="656.0" y="172.0" font-size="10.4" fill="#2E4A7D" text-anchor="end" font-weight="800" >넓이 9 배</text><text x="448.0" y="202.0" font-size="8.8" fill="#C0504D" text-anchor="start" font-weight="700" >눈은 넓이로 본다 — 그래서 부풀어 보인다</text><text x="20.0" y="268.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >값을 반지름에 실으면 차이가 과장되고, 넓이에 실으면 본 대로 읽힙니다.</text><text x="20.0" y="284.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >같은 자료라도 «무엇에 실었는가» 가 그림의 뜻을 바꿉니다.</text></svg>