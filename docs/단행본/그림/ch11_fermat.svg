<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >다섯 번 맞았다고 여섯 번째도 맞는 것은 아니다</text><rect x="34.0" y="47.0" width="420.0" height="26.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="64.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >F0</text><text x="96.0" y="64.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^1 + 1</text><text x="300.0" y="64.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >3</text><text x="318.0" y="64.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >소수</text><rect x="34.0" y="77.0" width="420.0" height="26.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="94.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >F1</text><text x="96.0" y="94.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^2 + 1</text><text x="300.0" y="94.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >5</text><text x="318.0" y="94.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >소수</text><rect x="34.0" y="107.0" width="420.0" height="26.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="124.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >F2</text><text x="96.0" y="124.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^4 + 1</text><text x="300.0" y="124.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >17</text><text x="318.0" y="124.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >소수</text><rect x="34.0" y="137.0" width="420.0" height="26.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="154.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >F3</text><text x="96.0" y="154.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^8 + 1</text><text x="300.0" y="154.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >257</text><text x="318.0" y="154.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >소수</text><rect x="34.0" y="167.0" width="420.0" height="26.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="184.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >F4</text><text x="96.0" y="184.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^16 + 1</text><text x="300.0" y="184.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >65,537</text><text x="318.0" y="184.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >소수</text><rect x="34.0" y="197.0" width="420.0" height="26.0" fill="#FFF6F5" stroke="none" stroke-width="1" rx="0"/><text x="52.0" y="214.0" font-size="10.4" fill="#C0504D" text-anchor="start" font-weight="800" >F5</text><text x="96.0" y="214.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >= 2^32 + 1</text><text x="300.0" y="214.0" font-size="10.4" fill="#1B2A4A" text-anchor="end" font-weight="700" >4,294,967,297</text><text x="318.0" y="214.0" font-size="9.6" fill="#C0504D" text-anchor="start" font-weight="800" >소수가 아니다</text><text x="52.0" y="248.0" font-size="13" fill="#C0504D" text-anchor="start" font-weight="800" >4,294,967,297 = 641 × 6,700,417</text><text x="52.0" y="266.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="700" >1732년 오일러 — 추측이 깨지는 데 필요한 것은 반례 «하나»</text><rect x="460.0" y="56.0" width="206.0" height="170.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="476.0" y="80.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >오일러가 줄인 후보</text><text x="476.0" y="98.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >F₅ 의 소인수는 64k + 1 꼴</text><text x="492.0" y="124.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="400" >193</text><text x="492.0" y="144.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="400" >257</text><text x="492.0" y="164.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="400" >449</text><text x="492.0" y="184.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="400" >577</text><text x="492.0" y="204.0" font-size="10.2" fill="#C0504D" text-anchor="start" font-weight="800" >641</text><text x="546.0" y="204.0" font-size="9" fill="#C0504D" text-anchor="start" font-weight="800" >← 나눠떨어진다</text><text x="476.0" y="240.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="700" >다섯 번만 나눠 보면 됐다</text><rect x="34.0" y="286.0" width="632.0" height="32.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="350.0" y="306.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >「지금까지 다 맞았다」는 증명이 아니다 — 반례 하나면 끝난다</text></svg>