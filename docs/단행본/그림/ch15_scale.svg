<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >길이 k 배 → 겉넓이 k² 배 · 부피 k³ 배</text><rect x="70.0" y="141.5" width="17.0" height="17.0" fill="#E8F0FA" stroke="#2E4A7D" stroke-width="1.6" rx="2"/><text x="78.5" y="174.5" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >k = 1</text><rect x="113.0" y="133.0" width="34.0" height="34.0" fill="#E8F0FA" stroke="#2E4A7D" stroke-width="1.6" rx="2"/><text x="130.0" y="183.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >k = 2</text><rect x="173.0" y="116.0" width="68.0" height="68.0" fill="#E8F0FA" stroke="#2E4A7D" stroke-width="1.6" rx="2"/><text x="207.0" y="200.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="700" >k = 4</text><text x="320.0" y="70.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >k</text><text x="400.0" y="70.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >겉넓이</text><text x="480.0" y="70.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >부피</text><text x="580.0" y="70.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >겉넓이 ÷ 부피</text><line x1="300.0" y1="78.0" x2="666.0" y2="78.0" stroke="#C7D2E4" stroke-width="1"/><text x="320.0" y="102.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >1</text><text x="400.0" y="102.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >1 배</text><text x="480.0" y="102.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >1 배</text><text x="580.0" y="102.0" font-size="10.2" fill="#0E8A7B" text-anchor="middle" font-weight="800" >1.00 배</text><text x="320.0" y="130.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >2</text><text x="400.0" y="130.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >4 배</text><text x="480.0" y="130.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >8 배</text><text x="580.0" y="130.0" font-size="10.2" fill="#0E8A7B" text-anchor="middle" font-weight="800" >0.50 배</text><text x="320.0" y="158.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >4</text><text x="400.0" y="158.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >16 배</text><text x="480.0" y="158.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >64 배</text><text x="580.0" y="158.0" font-size="10.2" fill="#0E8A7B" text-anchor="middle" font-weight="800" >0.25 배</text><text x="320.0" y="186.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >10</text><text x="400.0" y="186.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >100 배</text><text x="480.0" y="186.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >1000 배</text><text x="580.0" y="186.0" font-size="10.2" fill="#0E8A7B" text-anchor="middle" font-weight="800" >0.10 배</text><rect x="34.0" y="244.0" width="632.0" height="44.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="350.0" y="264.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >부피는 k³ 로 치솟고 겉넓이는 k² 로 따라간다</text><text x="350.0" y="280.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="700" >그래서 커질수록 «겉넓이 ÷ 부피» 가 작아진다 — 열이 빠져나갈 길이 좁아진다</text></svg>