<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >한 점에 모아 보면 — 360° 가 되는가</text><polygon points="180.00,196.00 180.00,134.00 233.69,103.00 287.39,134.00 287.39,196.00 233.69,227.00" fill="#EAF4F1" stroke="#0E8A7B" stroke-width="1.6" stroke-linejoin="round"/><polygon points="180.00,196.00 126.31,227.00 72.61,196.00 72.61,134.00 126.31,103.00 180.00,134.00" fill="#EAF4F1" stroke="#0E8A7B" stroke-width="1.6" stroke-linejoin="round"/><polygon points="180.00,196.00 233.69,227.00 233.69,289.00 180.00,320.00 126.31,289.00 126.31,227.00" fill="#EAF4F1" stroke="#0E8A7B" stroke-width="1.6" stroke-linejoin="round"/><circle cx="180.0" cy="196.0" r="3.2" fill="#1B2A4A"/><text x="180.0" y="268.0" font-size="11" fill="#0E8A7B" text-anchor="middle" font-weight="800" >정육각형 120° × 3 = 360°</text><text x="180.0" y="286.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >빈틈이 없다</text><polygon points="480.00,196.00 480.00,134.00 538.97,114.84 575.41,165.00 538.97,215.16" fill="#FDF4E3" stroke="#E8A020" stroke-width="1.6" stroke-linejoin="round"/><polygon points="480.00,196.00 421.03,215.16 384.59,165.00 421.03,114.84 480.00,134.00" fill="#FDF4E3" stroke="#E8A020" stroke-width="1.6" stroke-linejoin="round"/><polygon points="480.00,196.00 516.44,246.16 480.00,296.32 421.03,277.16 421.03,215.16" fill="#FDF4E3" stroke="#E8A020" stroke-width="1.6" stroke-linejoin="round"/><circle cx="480.0" cy="196.0" r="3.2" fill="#1B2A4A"/><text x="480.0" y="268.0" font-size="11" fill="#E8A020" text-anchor="middle" font-weight="800" >정오각형 108° × 3 = 324°</text><text x="480.0" y="286.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >36° 가 남는다</text><path d="M 480.0 196.0 L 505.9 160.4 A 44 44 0 0 0 480.0 152.0 Z" fill="#FBDADA" stroke="#C0504D" stroke-width="1.2"/><text x="499.2" y="141.0" font-size="11" fill="#C0504D" text-anchor="middle" font-weight="800" >36°</text><text x="20.0" y="308.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >한 점에서 각이 모자라면 빈틈이 생기고, 넘치면 겹칩니다. «꼭» 360° 여야 합니다.</text></svg>