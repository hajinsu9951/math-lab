<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >두 번 걸러진 237 만 명</text><rect x="70.0" y="74.0" width="560.0" height="40.0" fill="#4A7DBF" stroke="#fff" stroke-width="1" rx="7"/><text x="350.0" y="92.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" >미국의 투표자</text><text x="350.0" y="107.0" font-size="8.6" fill="#fff" text-anchor="middle" font-weight="700" >전부</text><text x="350.0" y="130.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="400" >이 가운데 누구에게 물을지 고른다</text><rect x="185.0" y="142.0" width="330.0" height="40.0" fill="#E8A020" stroke="#fff" stroke-width="1" rx="7"/><text x="350.0" y="160.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" >주소를 구할 수 있던 사람</text><text x="350.0" y="175.0" font-size="8.6" fill="#fff" text-anchor="middle" font-weight="700" >1000만 명에게 보냄</text><text x="350.0" y="198.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="400" >전화·자동차·회원 명부 — 형편이 나은 쪽에 쏠렸다</text><rect x="275.0" y="210.0" width="150.0" height="40.0" fill="#C0504D" stroke="#fff" stroke-width="1" rx="7"/><text x="350.0" y="228.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" >답장을 보낸 사람</text><text x="350.0" y="243.0" font-size="8.6" fill="#fff" text-anchor="middle" font-weight="700" >237만 장 (넷 중 하나)</text><text x="350.0" y="266.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="400" >답장할 마음이 큰 쪽에 다시 쏠렸다</text><rect x="34.0" y="268.0" width="632.0" height="30.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="6"/><text x="350.0" y="288.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >표본이 커도 «치우친 채로» 커지면 오차는 줄지 않는다</text></svg>