cx="111.8" cy="192.2" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="111.8" y="178.2" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >1918 · 라인하르트</text><text x="111.8" y="166.2" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >박사 논문 — 다섯 가지</text><circle cx="360.5" cy="160.0" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="360.5" y="180.0" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >1968 · 커슈너</text><text x="360.5" y="192.0" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >셋을 더하고 「전부」라 함</text><circle cx="395.3" cy="149.2" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="395.3" y="135.2" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >1975 · 제임스</text><text x="395.3" y="123.2" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >가드너의 칼럼을 읽은 독자</text><circle cx="405.3" cy="106.2" r="3.6" fill="#fff" stroke="#E8A020" stroke-width="2"/><text x="405.3" y="126.2" font-size="8.8" fill="#E8A020" text-anchor="middle" font-weight="800" >1977 · 라이스</text><text x="405.3" y="138.2" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >주부 — 혼자 넷을 찾음</text><circle cx="445.0" cy="95.5" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="445.0" y="81.5" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >1985 · 슈타인</text><text x="445.0" y="69.5" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >대학원생</text><circle cx="594.3" cy="84.8" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="594.3" y="104.8" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >2015 · 맨과 동료들</text><text x="594.3" y="116.8" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >컴퓨터로 탐색</text><circle cx="604.2" cy="84.8" r="3.6" fill="#fff" stroke="#2E4A7D" stroke-width="2"/><text x="604.2" y="70.8" font-size="8.8" fill="#1B2A4A" text-anchor="middle" font-weight="800" >2017 · 라오</text><text x="604.2" y="58.8" font-size="8" fill="#5A6779" text-anchor="middle" font-weight="400" >「열다섯이 전부」 증명</text><text x="644.0" y="58.8" font-size="13" fill="#2E4A7D" text-anchor="end" font-weight="800" >15</text><rect x="34.0" y="278.0" width="632.0" height="40.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="350.0" y="296.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >「이것이 전부」라는 말이 두 번 나왔고, 두 번 다 아니었다</text><text x="350.0" y="311.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="700" >세 번째 「전부」(2017)는 컴퓨터 증명이며 아직 정식 심사를 거치지 않았다</text></svg>