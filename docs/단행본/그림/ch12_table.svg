<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >한 종류로 바닥을 채울 수 있는 정다각형은 셋뿐이다</text><text x="66.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >n</text><text x="170.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >내각의 합</text><text x="300.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >한 내각</text><text x="430.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >360 ÷ 한 내각</text><text x="566.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >한 종류로 채우기</text><line x1="34.0" y1="68.0" x2="666.0" y2="68.0" stroke="#C7D2E4" stroke-width="1.2"/><rect x="34.0" y="75.0" width="632.0" height="23.0" fill="#F0F7F4" stroke="none" stroke-width="1" rx="0"/><text x="66.0" y="92.0" font-size="10.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >3</text><text x="170.0" y="92.0" font-size="9.6" fill="#5A6779" text-anchor="middle" font-weight="400" >180°</text><text x="300.0" y="92.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >60°</text><text x="430.0" y="92.0" font-size="10" fill="#0E8A7B" text-anchor="middle" font-weight="800" >6</text><text x="566.0" y="92.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >○ 된다</text><rect x="34.0" y="100.0" width="632.0" height="23.0" fill="#F0F7F4" stroke="none" stroke-width="1" rx="0"/><text x="66.0" y="117.0" font-size="10.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >4</text><text x="170.0" y="117.0" font-size="9.6" fill="#5A6779" text-anchor="middle" font-weight="400" >360°</text><text x="300.0" y="117.0" font-size="10" fill="#1B2A4A" text-anchor="middle" font-weight="700" >90°</text><text x="430.0" y="117.0" font