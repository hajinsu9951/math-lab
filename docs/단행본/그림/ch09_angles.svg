<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >평행선을 가로지르면 생기는 여덟 각 (자른 각 65°)</text><line x1="187.4" y1="40.0" x2="317.9" y2="320.0" stroke="#E8A020" stroke-width="2.2"/><line x1="70.0" y1="110.0" x2="470.0" y2="110.0" stroke="#1B2A4A" stroke-width="2.2"/><line x1="70.0" y1="250.0" x2="470.0" y2="250.0" stroke="#1B2A4A" stroke-width="2.2"/><text x="478.0" y="114.0" font-size="12" fill="#1B2A4A" text-anchor="start" font-weight="800" >ℓ</text><text x="478.0" y="254.0" font-size="12" fill="#1B2A4A" text-anchor="start" font-weight="800" >m</text><text x="60.0" y="56.0" font-size="9.2" fill="#E8A020" text-anchor="middle" font-weight="700" >가로지르는 선</text><text x="254.0" y="84.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >①</text><text x="254.0" y="99.0" font-size="10.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >115°</text><text x="186.0" y="84.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >②</text><text x="186.0" y="99.0" font-size="10.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >65°</text><text x="254.0" y="136.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >③</text><text x="254.0" y="151.0" font-size="10.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >65°</text><text x="186.0" y="136.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >④</text><text x="186.0" y="151.0" font-size="10.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >115°</text><text x="319.3" y="224.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >⑤</text><text x="319.3" y="239.0" font-size="10.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >115°</text><text x="251.3" y="224.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >⑥</text><text x="251.3" y="239.0" font-size="10.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >65°</text><text x="319.3" y="276.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >⑦</text><text x="319.3" y="291.0" font-size="10.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >65°</text><text x="251.3" y="276.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >⑧</text><text x="251.3" y="291.0" font-size="10.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >115°</text><rect x="484.0" y="60.0" width="192.0" height="190.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="500.0" y="92.0" font-size="11" fill="#4A7DBF" text-anchor="start" font-weight="800" >동위각</text><text x="664.0" y="92.0" font-size="9" fill="#5A6779" text-anchor="end" font-weight="700" >③ 과 ⑦</text><text x="500.0" y="110.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >65° = 65°</text><text x="664.0" y="110.0" font-size="9.2" fill="#4A7DBF" text-anchor="end" font-weight="800" >같다</text><line x1="494.0" y1="124.0" x2="670.0" y2="124.0" stroke="#C7D2E4" stroke-width="0.9"/><text x="500.0" y="152.0" font-size="11" fill="#0E8A7B" text-anchor="start" font-weight="800" >엇각</text><text x="664.0" y="152.0" font-size="9" fill="#5A6779" text-anchor="end" font-weight="700" >④ 와 ⑥</text><text x="500.0" y="170.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >115° = 115°</text><text x="664.0" y="170.0" font-size="9.2" fill="#0E8A7B" text-anchor="end" font-weight="800" >같다</text><line x1="494.0" y1="184.0" x2="670.0" y2="184.0" stroke="#C7D2E4" stroke-width="0.9"/><text x="500.0" y="212.0" font-size="11" fill="#E8A020" text-anchor="start" font-weight="800" >동측내각</text><text x="664.0" y="212.0" font-size="9" fill="#5A6779" text-anchor="end" font-weight="700" >③ 과 ⑥</text><text x="500.0" y="230.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >65° + 115° = 180°</text><text x="664.0" y="230.0" font-size="9.2" fill="#E8A020" text-anchor="end" font-weight="800" >합이 180°</text><text x="20.0" y="316.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >한 직선 위의 이웃한 두 각은 늘 합이 180° 입니다(① + ② = 180°). 여기서 나머지가 모두 따라 나옵니다.</text><text x="20.0" y="338.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >평행이 아니면 — 이름은 그대로지만 크기는 더 이상 같지 않습니다. 다음 그림에서 확인합니다.</text></svg>