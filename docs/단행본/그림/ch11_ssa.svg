<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >같은 값으로 삼각형이 둘 — SSA 가 조건이 아닌 까닭</text><line x1="70.0" y1="262.0" x2="300.0" y2="262.0" stroke="#1B2A4A" stroke-width="2.4"/><line x1="70.0" y1="262.0" x2="348.9" y2="101.0" stroke="#5A6779" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 347.2 132.3 A 138.0 138.0 0 0 0 164.1 238.0" fill="none" stroke="#E8A020" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="300.0" y1="262.0" x2="242.5" y2="162.4" stroke="#C7D2E4" stroke-width="1" stroke-dasharray="2 3"/><line x1="70.0" y1="262.0" x2="176.4" y2="200.5" stroke="#4A7DBF" stroke-width="2.6"/><line x1="300.0" y1="262.0" x2="176.4" y2="200.5" stroke="#4A7DBF" stroke-width="2.6"/><circle cx="176.4" cy="200.5" r="3.6" fill="#fff" stroke="#4A7DBF" stroke-width="2"/><text x="172.4" y="190.5" font-size="10" fill="#4A7DBF" text-anchor="end" font-weight="800" >①</text><line x1="70.0" y1="262.0" x2="308.6" y2="124.3" stroke="#0E8A7B" stroke-width="2.6"/><line x1="300.0" y1="262.0" x2="308.6" y2="124.3" stroke="#0E8A7B" stroke-width="2.6"/><circle cx="308.6" cy="124.3" r="3.6" fill="#fff" stroke="#0E8A7B" stroke-width="2"/><text x="304.6" y="114.3" font-size="10" fill="#0E8A7B" text-anchor="end" font-weight="800" >②</text><text x="64.0" y="268.0" font-size="11" fill="#1B2A4A" text-anchor="end" font-weight="800" >A</text><text x="308.0" y="268.0" font-size="11" fill="#1B2A4A" text-anchor="start" font-weight="800" >B</text><text x="185.0" y="282.0" font-size="9.4" fill="#1B2A4A" text-anchor="middle" font-weight="700" >AB = 100</text><text x="100.0" y="252.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="700" >30°</text><text x="90.0" y="128.0" font-size="9" fill="#E8A020" text-anchor="start" font-weight="700" >주황 호 — B 에서 60 만큼 떨어진 자리</text><rect x="436.0" y="56.0" width="232.0" height="178.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="452.0" y="80.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="800" >B 에서 반직선까지</text><text x="556.0" y="80.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >100 × sin 30°</text><text x="664.0" y="80.0" font-size="10.4" fill="#5A6779" text-anchor="end" font-weight="800" >= 50</text><text x="452.0" y="112.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="800" >A 에서 수선의 발까지</text><text x="556.0" y="112.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >100 × cos 30°</text><text x="664.0" y="112.0" font-size="10.4" fill="#5A6779" text-anchor="end" font-weight="800" >≒ 86.6</text><text x="452.0" y="144.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="800" >그 양옆으로</text><text x="556.0" y="144.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >√(60² − 50²)</text><text x="664.0" y="144.0" font-size="10.4" fill="#5A6779" text-anchor="end" font-weight="800" >≒ 33.2</text><text x="452.0" y="176.0" font-size="9.4" fill="#4A7DBF" text-anchor="start" font-weight="800" >① AC</text><text x="556.0" y="176.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >86.6 − 33.2</text><text x="664.0" y="176.0" font-size="10.4" fill="#4A7DBF" text-anchor="end" font-weight="800" >≒ 53.4</text><text x="452.0" y="208.0" font-size="9.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >② AC</text><text x="556.0" y="208.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >86.6 + 33.2</text><text x="664.0" y="208.0" font-size="10.4" fill="#0E8A7B" text-anchor="end" font-weight="800" >≒ 119.8</text><rect x="34.0" y="292.0" width="632.0" height="34.0" fill="#FFF6F5" stroke="#E6C4C0" stroke-width="1" rx="7"/><text x="350.0" y="314.0" font-size="11.4" fill="#C0504D" text-anchor="middle" font-weight="800" >세 값(100 · 60 · 30°)이 같은데 모양이 둘 — 반례가 하나만 있어도 「조건」이 되지 못한다</text></svg>