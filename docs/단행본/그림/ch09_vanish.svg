<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >평행한 철길이 한 점으로 모이는 까닭</text><text x="20.0" y="54.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="800" >① 위에서 본 실제 — 간격이 끝까지 같다</text><line x1="128.5" y1="297.2" x2="128.5" y2="116.8" stroke="#1B2A4A" stroke-width="2"/><line x1="171.5" y1="297.2" x2="171.5" y2="116.8" stroke="#1B2A4A" stroke-width="2"/><line x1="128.5" y1="297.2" x2="171.5" y2="297.2" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="280.8" x2="171.5" y2="280.8" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="264.4" x2="171.5" y2="264.4" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="248.0" x2="171.5" y2="248.0" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="231.6" x2="171.5" y2="231.6" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="215.2" x2="171.5" y2="215.2" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="198.8" x2="171.5" y2="198.8" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="182.4" x2="171.5" y2="182.4" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="166.0" x2="171.5" y2="166.0" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="149.6" x2="171.5" y2="149.6" stroke="#5A6779" stroke-width="1.2"/><line x1="128.5" y1="133.2" x2="171.5" y2="133.2" stroke="#5A6779" stroke-width="1.2"/><circle cx="150.0" cy="330.0" r="4" fill="#E8A020"/><text x="138.0" y="334.0" font-size="9.2" fill="#E8A020" text-anchor="end" font-weight="800" >눈</text><text x="181.5" y="289.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="700" >1.435 m</text><text x="181.5" y="207.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="700" >침목 2 m 마다</text><text x="20.0" y="348.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >