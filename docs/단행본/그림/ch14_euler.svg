<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 326" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >v − e + f 는 언제나 2</text><text x="62.0" y="62.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" ></text><text x="320.0" y="62.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >꼭짓점 v</text><text x="400.0" y="62.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >모서리 e</text><text x="480.0" y="62.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >면 f</text><text x="590.0" y="62.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >v − e + f</text><line x1="34.0" y1="70.0" x2="666.0" y2="70.0" stroke="#C7D2E4" stroke-width="1.2"/><text x="62.0" y="96.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >정사면체</text><text x="320.0" y="96.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >4</text><text x="400.0" y="96.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >6</text><text x="480.0" y="96.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >4</text><text x="590.0" y="96.0" font-size="12" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text><text x="62.0" y="128.0" font-size="10.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >정육면체</text><text x="320.0" y="128.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >8</text><text x="400.0" y="128.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >12</text><text x="480.0" y="128.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="400" >6</text><text x="590.0" y="128.0" font-size="12" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text><text x="62.0" y="160.0" font-size="10.2" fill="#1B2A4A" text-anc