<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >커질수록 «겉넓이 ÷ 부피» 가 작아진다</text><text x="20.0" y="52.0" font-size="10" fill="#5A6779" text-anchor="start" font-weight="700" >몸을 한 변 a 인 정육면체로 어림잡으면  겉넓이 ÷ 부피 = 6a² ÷ a³ = 6 ÷ a</text><text x="220.0" y="92.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >a (cm)</text><text x="330.0" y="92.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >겉넓이 ÷ 부피</text><text x="600.0" y="92.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="800" >생쥐의 몇 분의 몇</text><line x1="34.0" y1="100.0" x2="666.0" y2="100.0" stroke="#C7D2E4" stroke-width="1"/><text x="84.0" y="126.0" font-size="10.4" fill="#4A7DBF" text-anchor="start" font-weight="800" >생쥐</text><text x="220.0" y="126.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >5</text><text x="330.0" y="126.0" font-size="10.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >1.200</text><rect x="410.0" y="117.0" width="120.0" height="12.0" fill="#4A7DBF" stroke="none" stroke-width="0" rx="2"/><text x="600.0" y="126.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="700" >1 / 1</text><text x="84.0" y="156.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >고양이</text><text x="220.0" y="156.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >25</text><text x="330.0" y="156.0" font-size="10.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >0.240</text><rect x="410.0" y="147.0" width="24.0" height="12.0" fill="#0E8A7B" stroke="none" stroke-width="0" rx="2"/><text x="600.0" y="156.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="700" >1 / 5</text><text x="84.0" y="186.0" font-size="10.4" fill="#E8A020" text-anchor="start" font-weight="800" >사람</text><text x="220.0" y="186.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >40</text><text x="330.0" y="186.0" font-size="10.4" fill="#E8A020" text-anchor="middle" font-weight="800" >0.150</text><rect x="410.0" y="177.0" width="15.0" height="12.0" fill="#E8A020" stroke="none" stroke-width="0" rx="2"/><text x="600.0" y="186.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="700" >1 / 8</text><text x="84.0" y="216.0" font-size="10.4" fill="#C0504D" text-anchor="start" font-weight="800" >코끼리</text><text x="220.0" y="216.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="400" >200</text><text x="330.0" y="216.0" font-size="10.4" fill="#C0504D" text-anchor="middle" font-weight="800" >0.030</text><rect x="410.0" y="207.0" width="3.0" height="12.0" fill="#C0504D" stroke="none" stroke-width="0" rx="2"/><text x="600.0" y="216.0" font-size="9.8" fill="#5A6779" text-anchor="middle" font-weight="700" >1 / 40</text><rect x="34.0" y="254.0" width="632.0" height="48.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="350.0" y="274.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >코끼리는 생쥐의 1/40 — 열을 버릴 길이 그만큼 좁다</text><text x="350.0" y="292.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="700" >그래서 귀를 키운다. 코끼리 귀는 몸 전체 겉넓이의 5 분의 1 쯤 된다</text></svg>