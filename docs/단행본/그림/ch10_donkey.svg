<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >당나귀는 곧장 간다 — 두 변을 돌아가지 않는다</text><line x1="110.0" y1="210.0" x2="294.0" y2="210.0" stroke="#5A6779" stroke-width="2" stroke-dasharray="5 4"/><line x1="294.0" y1="210.0" x2="294.0" y2="72.0" stroke="#5A6779" stroke-width="2" stroke-dasharray="5 4"/><line x1="110.0" y1="210.0" x2="294.0" y2="72.0" stroke="#0E8A7B" stroke-width="3"/><text x="202.0" y="230.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="700" >400</text><text x="310.0" y="141.0" font-size="10" fill="#5A6779" text-anchor="middle" font-weight="700" >300</text><text x="188.0" y="131.0" font-size="11.4" fill="#0E8A7B" text-anchor="middle" font-weight="800" >500</text><circle cx="110.0" cy="210.0" r="4.4" fill="#1B2A4A"/><text x="110.0" y="230.0" font-size="9.2" fill="#1B2A4A" text-anchor="middle" font-weight="800" >당나귀</text><circle cx="294.0" cy="72.0" r="4.4" fill="#E8A020"/><text x="304.0" y="66.0" font-size="9.2" fill="#E8A020" text-anchor="start" font-weight="800" >먹이</text><rect x="430.0" y="68.0" width="236.0" height="150.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="446.0" y="100.0" font-size="10.2" fill="#5A6779" text-anchor="start" font-weight="800" >돌아가면</text><text x="446.0" y="117.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >400 + 300</text><text x="658.0" y="106.0" font-size="12.4" fill="#5A6779" text-anchor="end" font-weight="800" >= 700</text><line x1="440.0" y1="130.0" x2="662.0" y2="130.0" stroke="#C7D2E4" stroke-width="0.9"/><text x="446.0" y="144.0" font-size="10.2" fill="#0E8A7B" text-anchor="start" font-weight="800" >곧장 가면</text><text x="658.0" y="150.0" font-size="12.4" fill="#0E8A7B" text-anchor="end" font-weight="800" >= 500</text><line x1="440.0" y1="174.0" x2="662.0" y2="174.0" stroke="#C7D2E4" stroke-width="0.9"/><text x="446.0" y="188.0" font-size="10.2" fill="#E8A020" text-anchor="start" font-weight="800" >아낀 거리</text><text x="446.0" y="205.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="400" >700 − 500</text><text x="658.0" y="194.0" font-size="12.4" fill="#E8A020" text-anchor="end" font-weight="800" >= 200</text><rect x="34.0" y="250.0" width="632.0" height="38.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="350.0" y="268.0" font-size="11.6" fill="#1B2A4A" text-anchor="middle" font-weight="800" >한 경우를 아는 것과, 모든 경우에 그렇다고 «보이는» 것은 다른 일이다</text><text x="350.0" y="282.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="700" >프로클로스의 답 — 「감각에는 뻔해도, 학문을 만드는 추론에는 아니다」</text></svg>