<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >평행을 깨뜨리면 — 이름은 남고 성질만 사라진다</text><line x1="229.7" y1="42.5" x2="348.0" y2="296.3" stroke="#E8A020" stroke-width="2.2"/><line x1="60.0" y1="86.0" x2="560.0" y2="86.0" stroke="#1B2A4A" stroke-width="2.2"/><line x1="80.0" y1="212.0" x2="520.0" y2="289.6" stroke="#C0504D" stroke-width="2.2"/><text x="568.0" y="90.0" font-size="12" fill="#1B2A4A" text-anchor="start" font-weight="800" >ℓ</text><text x="528.0" y="293.6" font-size="12" fill="#C0504D" text-anchor="start" font-weight="800" >m</text><text x="196.0" y="44.0" font-size="9.2" fill="#E8A020" text-anchor="middle" font-weight="700" >가로지르는 선</text><text x="290.0" y="112.0" font-size="11.4" fill="#4A7DBF" text-anchor="middle" font-weight="800" >65°</text><text x="290.0" y="128.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >③ 동위각</text><text x="371.2" y="279.9" font-size="11.4" fill="#C0504D" text-anchor="middle" font-weight="800" >55°</text><text x="371.2" y="295.9" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >⑦ 동위각</text><text x="66.0" y="200.0" font-size="9.2" fill="#C0504D" text-anchor="start" font-weight="700" >m 을 10° 돌렸다</text><rect x="34.0" y="300.0" width="632.0" height="44.0" fill="#FFF6F5" stroke="#E6C4C0" stroke-width="1" rx="7"/><text x="350.0" y="320.0" font-size="12" fill="#C0504D" text-anchor="middle" font-weight="800" >동위각 65° ≠ 55°  — 이름은 「동위각」 그대로, 「같다」만 없어졌다</text><text x="350.0" y="336.0" font-size="9.2" fill="#5A6779" text-anchor="middle" font-weight="700" >그래서 증명에 「평행하므로」 를 반드시 적는다</text></svg>