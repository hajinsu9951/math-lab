<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="26.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >말로 쓴 식과 기호로 쓴 식 — 글자 수</text><text x="40.0" y="58.0" font-size="9.6" fill="#8A5A00" text-anchor="start" font-weight="400" >어떤 수를 셋 곱하고 하나를 더하라</text><rect x="40.0" y="66.0" width="288.1" height="13.0" fill="#F3E3C4" stroke="#E8C98A" stroke-width="1" rx="3"/><text x="334.1" y="76.0" font-size="9" fill="#8A5A00" text-anchor="start" font-weight="700" >19 자</text><text x="40.0" y="98.0" font-size="11.4" fill="#2E4A7D" text-anchor="start" font-weight="800" >3n + 1</text><rect x="40.0" y="106.0" width="91.0" height="13.0" fill="#4A7DBF" stroke="none" stroke-width="0" rx="3"/><text x="137.0" y="116.0" font-size="9" fill="#2E4A7D" text-anchor="start" font-weight="700" >6 자</text><text x="40.0" y="136.0" font-size="9.6" fill="#8A5A00" text-anchor="start" font-weight="400" >제곱 하나와 그 근 열 개가 서른아홉과 같다</text><rect x="40.0" y="144.0" width="363.9" height="13.0" fill="#F3E3C4" stroke="#E8C98A" stroke-width="1" rx="3"/><text x="409.9" y="154.0" font-size="9" fill="#8A5A00" text-anchor="start" font-weight="700" >24 자</text><text x="40.0" y="176.0" font-size="11.4" fill="#2E4A7D" text-anchor="start" font-weight="800" >x² + 10x = 39</text><rect x="40.0" y="184.0" width="197.1" height="13.0" fill="#4A7DBF" stroke="none" stroke-width="0" rx="3"/><text x="243.1" y="194.0" font-size="9" fill="#2E4A7D" text-anchor="start" font-weight="700" >13 자</text><text x="40.0" y="214.0" font-size="9.6" fill="#8A5A00" text-anchor="start" font-weight="400" >두 수의 합에 두 수의 차를 곱하면 두 제곱의 차와 같다</text><rect x="40.0" y="222.0" width="470.0" height="13.0" fill="#F3E3C4" stroke="#E8C98A" stroke-width="1" rx="3"/><text x="516.0" y="232.0" font-size="9" fill="#8A5A00" text-anchor="start" font-weight="700" >31 자</text><text x="40.0" y="254.0" font-size="11.4" fill="#2E4A7D" text-anchor="start" font-weight="800" >(a+b)(a−b) = a² − b²</text><rect x="40.0" y="262.0" width="303.2" height="13.0" fill="#4A7DBF" stroke="none" stroke-width="0" rx="3"/><text x="349.2" y="272.0" font-size="9" fill="#2E4A7D" text-anchor="start" font-weight="700" >20 자</text><text x="20.0" y="290.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >기호가 없던 시절에는 식 하나를 적는 데 한 문단이 들었습니다. «읽기»가 아니라 «적기»가 수학을 가로막았습니다.</text></svg>