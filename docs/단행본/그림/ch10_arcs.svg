<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 282" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >두 호가 만나는가 — 삼각형이 되는 조건</text><line x1="66.0" y1="175.0" x2="143.0" y2="175.0" stroke="#1B2A4A" stroke-width="2.4"/><path d="M 125.6 185.5 A 60.5 60.5 0 0 0 13.6 144.8" fill="none" stroke="#4A7DBF" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M 185.9 150.2 A 49.5 49.5 0 0 0 94.3 183.6" fill="none" stroke="#0E8A7B" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="66.0" y1="175.0" x2="112.4" y2="136.1" stroke="#4A7DBF" stroke-width="2.2"/><line x1="143.0" y1="175.0" x2="112.4" y2="136.1" stroke="#0E8A7B" stroke-width="2.2"/><circle cx="112.4" cy="136.1" r="3.4" fill="#fff" stroke="#0E8A7B" stroke-width="2"/><text x="66.0" y="195.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="700" >a = 140</text><text x="66.0" y="217.0" font-size="9.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >① 110 + 90 = 200 > 140</text><text x="66.0" y="233.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >만난다 — 삼각형이 된다</text><line x1="282.0" y1="175.0" x2="392.0" y2="175.0" stroke="#1B2A4A" stroke-width="2.4"/><path d="M 341.6 185.5 A 60.5 60.5 0 0 0 229.6 144.8" fill="none" stroke="#4A7DBF" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M 434.9 150.2 A 49.5 49.5 0 0 0 343.3 183.6" fill="none" stroke="#0E8A7B" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="342.5" cy="175.0" r="3.4" fill="#fff" stroke="#E8A020" stroke-width="2"/><text x="342.5" y="163.0" font-size="8.6" fill="#E8A020" text-anchor="middle" font-weight="700" >↓ 여기서 겨우 닿는다</text><text x="282.0" y="195.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="700" >a = 200</text><text x="282.0" y="217.0" font-size="9.6" fill="#E8A020" text-anchor="start" font-weight="800" >② 110 + 90 = 200 = 200</text><text x="282.0" y="233.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >한 점에서 닿는다 — 납작하다</text><line x1="498.0" y1="175.0" x2="630.0" y2="175.0" stroke="#1B2A4A" stroke-width="2.4"/><path d="M 557.6 185.5 A 60.5 60.5 0 0 0 445.6 144.8" fill="none" stroke="#4A7DBF" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M 672.9 150.2 A 49.5 49.5 0 0 0 581.3 183.6" fill="none" stroke="#0E8A7B" stroke-width="1.5" stroke-dasharray="3 3"/><text x="569.5" y="161.0" font-size="8.8" fill="#C0504D" text-anchor="middle" font-weight="800" >✕ 사이가 비어 있다</text><text x="498.0" y="195.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="700" >a = 240</text><text x="498.0" y="217.0" font-size="9.6" fill="#C0504D" text-anchor="start" font-weight="800" >③ 110 + 90 = 200 < 240</text><text x="498.0" y="233.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >못 만난다 — 삼각형이 없다</text><text x="20.0" y="266.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >컴퍼스로 호를 그리는 일은 「한 끝에서 그만큼 떨어진 곳을 모두 표시하는 일」입니다. 두 표시가 겹치는 자리가 꼭짓점입니다.</text></svg>