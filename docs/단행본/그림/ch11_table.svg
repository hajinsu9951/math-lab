<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >몇 개가 그려지는가 — 그것만 세면 된다</text><text x="56.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" ></text><text x="150.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" >무엇을 아는가</text><text x="320.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" >그려지는 삼각형</text><text x="430.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" >합동 조건인가</text><text x="520.0" y="60.0" font-size="9.2" fill="#5A6779" text-anchor="start" font-weight="800" >까닭</text><line x1="34.0" y1="68.0" x2="666.0" y2="68.0" stroke="#C7D2E4" stroke-width="1.2"/><rect x="34.0" y="76.0" width="632.0" height="32.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="56.0" y="94.0" font-size="11.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >SSS</text><text x="150.0" y="94.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="400" >세 변</text><text x="320.0" y="94.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >1 개</text><text x="430.0" y="94.0" font-size="9.8" fill="#0E8A7B" text-anchor="start" font-weight="800" >○ 조건</text><text x="520.0" y="94.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >두 호가 만나는 점이 하나로 굳는다</text><rect x="34.0" y="114.0" width="632.0" height="32.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="56.0" y="132.0" font-size="11.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >SAS</text><text x="150.0" y="132.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="400" >두 변과 그 끼인각</text><text x="320.0" y="132.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >1 개</text><text x="430.0" y="132.0" font-size="9.8" fill="#0E8A7B" text-anchor="start" font-weight="800" >○ 조건</text><text x="520.0" y="132.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >각이 두 변 사이에 끼어 있다</text><rect x="34.0" y="152.0" width="632.0" height="32.0" fill="#F6FBF9" stroke="none" stroke-width="1" rx="0"/><text x="56.0" y="170.0" font-size="11.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >ASA</text><text x="150.0" y="170.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="400" >한 변과 그 양 끝 각</text><text x="320.0" y="170.0" font-size="10.4" fill="#0E8A7B" text-anchor="start" font-weight="800" >1 개</text><text x="430.0" y="170.0" font-size="9.8" fill="#0E8A7B" text-anchor="start" font-weight="800" >○ 조건</text><text x="520.0" y="170.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >두 반직선이 한 점에서 만난다</text><rect x="34.0" y="190.0" width="632.0" height="32.0" fill="#FFF6F5" stroke="none" stroke-width="1" rx="0"/><text x="56.0" y="208.0" font-size="11.6" fill="#C0504D" text-anchor="start" font-weight="800" >SSA</text><text x="150.0" y="208.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="400" >두 변과 끼이지 «않은» 각</text><text x="320.0" y="208.0" font-size="10.4" fill="#C0504D" text-anchor="start" font-weight="800" >2 개</text><text x="430.0" y="208.0" font-size="9.8" fill="#C0504D" text-anchor="start" font-weight="800" >✕ 아니다</text><text x="520.0" y="208.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >원과 반직선이 두 점에서 만난다</text><rect x="34.0" y="228.0" width="632.0" height="32.0" fill="#FFF6F5" stroke="none" stroke-width="1" rx="0"/><text x="56.0" y="246.0" font-size="11.6" fill="#C0504D" text-anchor="start" font-weight="800" >AA</text><text x="150.0" y="246.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="400" >두 각만</text><text x="320.0" y="246.0" font-size="10.4" fill="#C0504D" text-anchor="start" font-weight="800" >무수히</text><text x="430.0" y="246.0" font-size="9.8" fill="#C0504D" text-anchor="start" font-weight="800" >✕ 아니다</text><text x="520.0" y="246.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >크기가 정해지지 않는다 — 닮음</text><text x="20.0" y="284.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >「조건이 된다」는 말은 «그 값들로 모양이 하나로 정해진다» 는 뜻입니다. 두 개가 나오면 정해진 것이 아닙니다.</text></svg>