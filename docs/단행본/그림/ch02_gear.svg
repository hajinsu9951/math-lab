<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="24.0" y="26.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >지나간 톱니 수</text><line x1="70.0" y1="80.0" x2="650.0" y2="80.0" stroke="#C7D2E4" stroke-width="1.2"/><text x="60.0" y="84.0" font-size="10" fill="#5A6779" text-anchor="end" font-weight="700" >톱니 12 개</text><circle cx="244.0" cy="80.0" r="5" fill="#4A7DBF"/><text x="244.0" y="69.0" font-size="9" fill="#4A7DBF" text-anchor="middle" font-weight="700" >12</text><circle cx="418.0" cy="80.0" r="5" fill="#4A7DBF"/><text x="418.0" y="69.0" font-size="9" fill="#4A7DBF" text-anchor="middle" font-weight="700" >24</text><circle cx="592.0" cy="80.0" r="5" fill="#4A7DBF"/><text x="592.0" y="69.0" font-size="9" fill="#4A7DBF" text-anchor="middle" font-weight="700" >36</text><line x1="70.0" y1="150.0" x2="650.0" y2="150.0" stroke="#C7D2E4" stroke-width="1.2"/><text x="60.0" y="154.0" font-size="10" fill="#5A6779" text-anchor="end" font-weight="700" >톱니 18 개</text><circle cx="331.0" cy="150.0" r="5" fill="#0E8A7B"/><text x="331.0" y="139.0" font-size="9" fill="#0E8A7B" text-anchor="middle" font-weight="700" >18</text><circle cx="592.0" cy="150.0" r="5" fill="#0E8A7B"/><text x="592.0" y="139.0" font-size="9" fill="#0E8A7B" text-anchor="middle" font-weight="700" >36</text><line x1="592.0" y1="58.0" x2="592.0" y2="178.0" stroke="#C0504D" stroke-width="1.6" stroke-dasharray="5,4"/><text x="592.0" y="50.0" font-size="10.5" fill="#C0504D" text-anchor="middle" font-weight="800" >36 — 처음으로 겹치는 때</text><text x="600.0" y="196.0" font-size="10" fill="#5A6779" text-anchor="start" font-weight="400" >작은 바퀴 3 바퀴 · 큰 바퀴 2 바퀴</text><text x="70.0" y="215.0" font-size="9.6" fill="#5A6779" text-anchor="start" font-weight="400" >12 의 배수(위)와 18 의 배수(아래)가 처음 만나는 자리가 최소공배수입니다.</text></svg>