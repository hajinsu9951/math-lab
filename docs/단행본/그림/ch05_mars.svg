<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="26.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >화성 표면에서 잰 높이 (km)</text><rect x="90.0" y="250.0" width="570.0" height="26.0" fill="#E8D5C4" stroke="none" stroke-width="1" rx="0"/><text x="95.0" y="267.0" font-size="9.6" fill="#8A5A00" text-anchor="start" font-weight="700" >화성 표면</text><line x1="90.0" y1="78.2" x2="660.0" y2="78.2" stroke="#4A7DBF" stroke-width="2.4"/><text x="664.0" y="82.2" font-size="9.8" fill="#4A7DBF" text-anchor="start" font-weight="800" >계획한 높이  226 km</text><line x1="90.0" y1="189.2" x2="660.0" y2="189.2" stroke="#E8A020" stroke-width="2.0" stroke-dasharray="6,4"/><text x="664.0" y="193.2" font-size="9.8" fill="#E8A020" text-anchor="start" font-weight="800" >살아남을 수 있는 가장 낮은 높이  약 80 km</text><line x1="90.0" y1="206.7" x2="660.0" y2="206.7" stroke="#C0504D" stroke-width="2.6"/><text x="664.0" y="210.7" font-size="9.8" fill="#C0504D" text-anchor="start" font-weight="800" >실제로 내려간 높이  57 km</text><text x="90.0" y="68.2" font-size="9.4" fill="#4A7DBF" text-anchor="start" font-weight="700" >궤도선</text><text x="20.0" y="292.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >같은 수 1 을 한쪽은 「파운드힘」으로, 다른 쪽은 「뉴턴」으로 읽었습니다. 단위가 다른 값을 같은 것으로 다룬 결과입니다.</text></svg>