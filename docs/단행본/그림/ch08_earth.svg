<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 302" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >지레는 힘을 줄여 준다 — 거리는 줄여 주지 않는다</text><rect x="34.0" y="40.0" width="632.0" height="46.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="58.0" font-size="10.2" fill="#4A7DBF" text-anchor="start" font-weight="800" >지구를 1 cm 들어올리는 데 드는 일</text><text x="52.0" y="76.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >5.9722×10²⁴ kg × 9.80665 m/s² × 0.01 m</text><text x="648.0" y="66.0" font-size="12.4" fill="#4A7DBF" text-anchor="end" font-weight="800" >≒ 5.86 × 10²³ J</text><text x="350.0" y="96.0" font-size="12" fill="#C7D2E4" text-anchor="middle" font-weight="800" >↓</text><rect x="34.0" y="96.0" width="632.0" height="46.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="114.0" font-size="10.2" fill="#2E4A7D" text-anchor="start" font-weight="800" >내가 600 N 으로 밀어 그 일을 하려면</text><text x="52.0" y="132.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >5.86×10²³ J ÷ 600 N</text><text x="648.0" y="122.0" font-size="12.4" fill="#2E4A7D" text-anchor="end" font-weight="800" >≒ 9.76 × 10²⁰ m</text><text x="350.0" y="152.0" font-size="12" fill="#C7D2E4" text-anchor="middle" font-weight="800" >↓</text><rect x="34.0" y="152.0" width="632.0" height="46.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="170.0" font-size="10.2" fill="#0E8A7B" text-anchor="start" font-weight="800" >그 거리를 광년으로 바꾸면</text><text x="52.0" y="188.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >9.76×10²⁰ m ÷ 9.4607×10¹⁵ m</text><text x="648.0" y="178.0" font-size="12.4" fill="#0E8A7B" text-anchor="end" font-weight="800" >≒ 10 만 광년</text><text x="350.0" y="208.0" font-size="12" fill="#C7D2E4" text-anchor="middle" font-weight="800" >↓</text><rect x="34.0" y="208.0" width="632.0" height="46.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="226.0" font-size="10.2" fill="#E8A020" text-anchor="start" font-weight="800" >1 m/s 로 밀어도 걸리는 시간</text><text x="52.0" y="244.0" font-size="9" fill="#5A6779" text-anchor="start" font-weight="400" >9.76×10²⁰ m ÷ 1 m/s</text><text x="648.0" y="234.0" font-size="12.4" fill="#E8A020" text-anchor="end" font-weight="800" >≒ 31 조 년</text><text x="20.0" y="294.0" font-size="9.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >아르키메데스의 말이 참인 까닭과, 그 말이 공허한 까닭이 같은 식 하나에 들어 있습니다 — 힘 × 거리.</text></svg>