<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >존 터키 — 한 사람이 남긴 말과 그림</text><text x="20.0" y="42.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="700" >이름을 잘 짓는 사람이었고, 자료를 먼저 보라고 한 사람이었다</text><path d="M 146.0 178.0 C 216.0 178.0, 154.0 84.0, 210.0 84.0" fill="none" stroke="#0E8A7B" stroke-width="1.8"/><rect x="214.0" y="60.0" width="462.0" height="48.0" fill="#FBFCFE" stroke="#0E8A7B" stroke-width="1.3" rx="9"/><circle cx="244.0" cy="84.0" r="18" fill="#fff" stroke="#0E8A7B" stroke-width="1.8"/><text x="244.0" y="88.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >1947</text><rect x="270.0" y="71.0" width="26.0" height="26.0" fill="#fff" stroke="#0E8A7B" stroke-width="1.2" rx="6"/><text x="283.0" y="89.0" font-size="11" fill="#0E8A7B" text-anchor="middle" font-weight="800" >01</text><text x="308.0" y="82.0" font-size="11.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >bit</text><text x="308.0" y="98.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >「이진 숫자(binary digit)」를 줄인 말</text><path d="M 146.0 178.0 C 216.0 178.0, 154.0 142.0, 210.0 142.0" fill="none" stroke="#2E4A7D" stroke-width="1.8"/><rect x="214.0" y="118.0" width="462.0" height="48.0" fill="#FBFCFE" stroke="#2E4A7D" stroke-width="1.3" rx="9"/><circle cx="244.0" cy="142.0" r="18" fill="#fff" stroke="#2E4A7D" stroke-width="1.8"/><text x="244.0" y="146.0" font-size="9.6" fill="#2E4A7D" text-anchor="middle" font-weight="800" >1958</text><rect x="270.0" y="129.0" width="26.0" height="26.0" fill="#fff" stroke="#2E4A7D" stroke-width="1.2" rx="6"/><text x="283.0" y="147.0" font-size="10" fill="#2E4A7D" text-anchor="middle" font-weight="800" >&lt;/&gt;</text><text x="308.0" y="140.0" font-size="11.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >소프트웨어</text><text x="308.0" y="156.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >활자로 남은 이른 예로 꼽힌다</text><path d="M 146.0 178.0 C 216.0 178.0, 154.0 200.0, 210.0 200.0" fill="none" stroke="#4A7DBF" stroke-width="1.8"/><rect x="214.0" y="176.0" width="462.0" height="48.0" fill="#FBFCFE" stroke="#4A7DBF" stroke-width="1.3" rx="9"/><circle cx="244.0" cy="200.0" r="18" fill="#fff" stroke="#4A7DBF" stroke-width="1.8"/><text x="244.0" y="204.0" font-size="9.6" fill="#4A7DBF" text-anchor="middle" font-weight="800" >1965</text><rect x="270.0" y="187.0" width="26.0" height="26.0" fill="#fff" stroke="#4A7DBF" stroke-width="1.2" rx="6"/><polyline fill="none" stroke="#4A7DBF" stroke-width="1.6" points="270.0,200.0 271.0,198.2 272.0,196.6 273.0,195.1 274.0,193.9 275.0,193.1 276.0,192.7 277.0,192.7 278.0,193.1 279.0,193.9 280.0,195.1 281.0,196.6 282.0,198.2 283.0,200.0 284.0,201.8 285.0,203.4 286.0,204.9 287.0,206.1 288.0,206.9 289.0,207.3 290.0,207.3 291.0,206.9 292.0,206.1 293.0,204.9 294.0,203.4 295.0,201.8 296.0,200.0"/><text x="308.0" y="198.0" font-size="11.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >빠른 푸리에 변환</text><text x="308.0" y="214.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >쿨리와 함께 — 신호를 빨리 푼다</text><path d="M 146.0 178.0 C 216.0 178.0, 154.0 258.0, 210.0 258.0" fill="none" stroke="#E8A020" stroke-width="1.8"/><rect x="214.0" y="234.0" width="462.0" height="48.0" fill="#FBFCFE" stroke="#E8A020" stroke-width="1.3" rx="9"/><circle cx="244.0" cy="258.0" r="18" fill="#fff" stroke="#E8A020" stroke-width="1.8"/><text x="244.0" y="262.0" font-size="9.6" fill="#E8A020" text-anchor="middle" font-weight="800" >1977</text><rect x="270.0" y="245.0" width="26.0" height="26.0" fill="#fff" stroke="#E8A020" stroke-width="1.2" rx="6"/><line x1="279.0" y1="250.0" x2="279.0" y2="266.0" stroke="#E8A020" stroke-width="1.2"/><text x="276.0" y="258.0" font-size="7.6" fill="#E8A020" text-anchor="end" font-weight="800" >6</text><text x="282.0" y="258.0" font-size="7.6" fill="#E8A020" text-anchor="start" font-weight="600" >0 2</text><text x="283.0" y="268.0" font-size="7" fill="#E8A020" text-anchor="middle" font-weight="400" ></text><text x="308.0" y="256.0" font-size="11.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >줄기와 잎 그림</text><text x="308.0" y="272.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >『탐색적 자료 분석』에서</text><path d="M 146.0 178.0 C 216.0 178.0, 154.0 316.0, 210.0 316.0" fill="none" stroke="#C0504D" stroke-width="1.8"/><rect x="214.0" y="292.0" width="462.0" height="48.0" fill="#FBFCFE" stroke="#C0504D" stroke-width="1.3" rx="9"/><circle cx="244.0" cy="316.0" r="18" fill="#fff" stroke="#C0504D" stroke-width="1.8"/><text x="244.0" y="320.0" font-size="9.6" fill="#C0504D" text-anchor="middle" font-weight="800" >1977</text><rect x="270.0" y="303.0" width="26.0" height="26.0" fill="#fff" stroke="#C0504D" stroke-width="1.2" rx="6"/><line x1="273.0" y1="316.0" x2="293.0" y2="316.0" stroke="#C0504D" stroke-width="1.2"/><rect x="278.0" y="311.0" width="10.0" height="10.0" fill="#fff" stroke="#C0504D" stroke-width="1.4" rx="1.5"/><line x1="283.0" y1="311.0" x2="283.0" y2="321.0" stroke="#C0504D" stroke-width="1.2"/><text x="308.0" y="314.0" font-size="11.2" fill="#1B2A4A" text-anchor="start" font-weight="800" >상자 그림</text><text x="308.0" y="330.0" font-size="8.6" fill="#5A6779" text-anchor="start" font-weight="400" >같은 책에서 — 네 토막으로 본다</text><circle cx="96.0" cy="178.0" r="50" fill="#F3F6FC" stroke="#1B2A4A" stroke-width="2.6"/><text x="96.0" y="176.0" font-size="13.5" fill="#1B2A4A" text-anchor="middle" font-weight="800" >존 터키</text><text x="96.0" y="195.0" font-size="8.6" fill="#5A6779" text-anchor="middle" font-weight="700" >1915~2000</text></svg>