<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="26.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >같은 그림, 세 가지 셈법 — n = 4 일 때 성냥개비 13 개</text><text x="20.0" y="74.0" font-size="12" fill="#4A7DBF" text-anchor="start" font-weight="800" >3n + 1</text><text x="20.0" y="90.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >맨 앞 세로 한 개 + 칸마다 ⊐ 세 개</text><line x1="240.0" y1="62.0" x2="296.0" y2="62.0" stroke="#4A7DBF" stroke-width="3"/><line x1="240.0" y1="118.0" x2="296.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="240.0" y1="62.0" x2="240.0" y2="118.0" stroke="#C0504D" stroke-width="3"/><line x1="296.0" y1="62.0" x2="296.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="296.0" y1="62.0" x2="352.0" y2="62.0" stroke="#4A7DBF" stroke-width="3"/><line x1="296.0" y1="118.0" x2="352.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="296.0" y1="62.0" x2="296.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="352.0" y1="62.0" x2="352.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="352.0" y1="62.0" x2="408.0" y2="62.0" stroke="#4A7DBF" stroke-width="3"/><line x1="352.0" y1="118.0" x2="408.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="352.0" y1="62.0" x2="352.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="408.0" y1="62.0" x2="408.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="408.0" y1="62.0" x2="464.0" y2="62.0" stroke="#4A7DBF" stroke-width="3"/><line x1="408.0" y1="118.0" x2="464.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="408.0" y1="62.0" x2="408.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><line x1="464.0" y1="62.0" x2="464.0" y2="118.0" stroke="#4A7DBF" stroke-width="3"/><text x="478.0" y="94.0" font-size="11" fill="#4A7DBF" text-anchor="start" font-weight="800" >= 13 개</text><text x="20.0" y="192.0" font-size="12" fill="#0E8A7B" text-anchor="start" font-weight="800" >4 + 3(n − 1)</text><text x="20.0" y="208.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >첫 칸 네 개 + 나머지 칸마다 세 개</text><line x1="240.0" y1="180.0" x2="296.0" y2="180.0" stroke="#0E8A7B" stroke-width="3"/><line x1="240.0" y1="236.0" x2="296.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="240.0" y1="180.0" x2="240.0" y2="236.0" stroke="#C0504D" stroke-width="3"/><line x1="296.0" y1="180.0" x2="296.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="296.0" y1="180.0" x2="352.0" y2="180.0" stroke="#0E8A7B" stroke-width="3"/><line x1="296.0" y1="236.0" x2="352.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="296.0" y1="180.0" x2="296.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="352.0" y1="180.0" x2="352.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="352.0" y1="180.0" x2="408.0" y2="180.0" stroke="#0E8A7B" stroke-width="3"/><line x1="352.0" y1="236.0" x2="408.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="352.0" y1="180.0" x2="352.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="408.0" y1="180.0" x2="408.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="408.0" y1="180.0" x2="464.0" y2="180.0" stroke="#0E8A7B" stroke-width="3"/><line x1="408.0" y1="236.0" x2="464.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="408.0" y1="180.0" x2="408.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><line x1="464.0" y1="180.0" x2="464.0" y2="236.0" stroke="#0E8A7B" stroke-width="3"/><text x="478.0" y="212.0" font-size="11" fill="#0E8A7B" text-anchor="start" font-weight="800" >= 13 개</text><text x="20.0" y="310.0" font-size="12" fill="#E8A020" text-anchor="start" font-weight="800" >4n − (n − 1)</text><text x="20.0" y="326.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >칸마다 네 개로 세고 겹친 n−1 개를 뺀다</text><line x1="240.0" y1="298.0" x2="296.0" y2="298.0" stroke="#E8A020" stroke-width="3"/