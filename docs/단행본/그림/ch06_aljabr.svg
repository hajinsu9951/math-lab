<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="26.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >알자브르와 알무카발라 — 두 가지 동작</text><rect x="34.0" y="54.0" width="632.0" height="86.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="74.0" font-size="11.6" fill="#4A7DBF" text-anchor="start" font-weight="800" >알자브르 (al-jabr)</text><text x="52.0" y="92.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >흩어진 것을 제자리로 — 모자란 쪽을 채운다</text><text x="300.0" y="112.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="700" >x² = 40x − 4x²</text><text x="410.0" y="112.0" font-size="13" fill="#4A7DBF" text-anchor="middle" font-weight="800" >→</text><text x="530.0" y="112.0" font-size="12" fill="#4A7DBF" text-anchor="middle" font-weight="800" >5x² = 40x</text><text x="300.0" y="130.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="400" >양변에 4x² 을 더했다</text><rect x="34.0" y="162.0" width="632.0" height="86.0" fill="#FBFCFE" stroke="#C7D2E4" stroke-width="1" rx="7"/><text x="52.0" y="182.0" font-size="11.6" fill="#0E8A7B" text-anchor="start" font-weight="800" >알무카발라 (al-muqābala)</text><text x="52.0" y="200.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >마주 놓고 같은 것을 지운다</text><text x="300.0" y="220.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="700" >50 + x² = 29 + 10x</text><text x="410.0" y="220.0" font-size="13" fill="#0E8A7B" text-anchor="middle" font-weight="800" >→</text><text x="530.0" y="220.0" font-size="12" fill="#0E8A7B" text-anchor="middle" font-weight="800" >21 + x² = 10x</text><text x="300.0" y="238.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="400" >양변에서 29 를 뺐다</text><text x="20.0" y="282.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="400" >책 제목 『알자브르와 알무카발라의 계산에 관한 간략한 책』에서 앞 낱말이 오늘의 「대수(algebra)」가 되었습니다.</text></svg>