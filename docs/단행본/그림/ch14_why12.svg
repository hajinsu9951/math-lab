<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" width="100%" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"><text x="20.0" y="24.0" font-size="12.5" fill="#1B2A4A" text-anchor="start" font-weight="800" >오각형은 왜 꼭 12 개인가</text><text x="20.0" y="54.0" font-size="9.6" fill="#5A6779" text-anchor="start" font-weight="700" >오각형 p 개 · 육각형 h 개 · 꼭짓점마다 모서리 셋이라 두면</text><text x="44.0" y="84.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="700" >면</text><text x="110.0" y="84.0" font-size="10.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >f = p + h</text><text x="44.0" y="110.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="700" >모서리</text><text x="110.0" y="110.0" font-size="10.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >e = (5p + 6h) ÷ 2</text><text x="270.0" y="110.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >— 변을 두 면이 나눠 쓴다</text><text x="44.0" y="136.0" font-size="9.4" fill="#5A6779" text-anchor="start" font-weight="700" >꼭짓점</text><text x="110.0" y="136.0" font-size="10.6" fill="#1B2A4A" text-anchor="start" font-weight="700" >v = (5p + 6h) ÷ 3</text><text x="270.0" y="136.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="400" >— 꼭짓점마다 면 셋이 모인다</text><rect x="34.0" y="172.0" width="632.0" height="46.0" fill="#F0F7F4" stroke="none" stroke-width="1" rx="0"/><text x="350.0" y="192.0" font-size="14" fill="#0E8A7B" text-anchor="middle" font-weight="800" >v − e + f = p ÷ 6 = 2   ⇒   p = 12</text><text x="350.0" y="208.0" font-size="9" fill="#5A6779" text-anchor="middle" font-weight="700" >h 이 식에서 깨끗이 지워진다 — 육각형 수는 상관이 없다</text><text x="78.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="start" font-weight="800" ></text><text x="250.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="800" >육각형 h</text><text x="340.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="800" >오각형 p</text><text x="420.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="800" >꼭짓점 v</text><text x="500.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="800" >모서리 e</text><text x="600.0" y="248.0" font-size="8.8" fill="#5A6779" text-anchor="middle" font-weight="800" >v − e + f</text><line x1="34.0" y1="256.0" x2="666.0" y2="256.0" stroke="#C7D2E4" stroke-width="1"/><text x="78.0" y="278.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >정십이면체</text><text x="250.0" y="278.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >0</text><text x="340.0" y="278.0" font-size="10" fill="#0E8A7B" text-anchor="middle" font-weight="800" >12</text><text x="420.0" y="278.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >20</text><text x="500.0" y="278.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >30</text><text x="600.0" y="278.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text><text x="78.0" y="298.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >축구공 (깎은 정이십면체)</text><text x="250.0" y="298.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >20</text><text x="340.0" y="298.0" font-size="10" fill="#0E8A7B" text-anchor="middle" font-weight="800" >12</text><text x="420.0" y="298.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >60</text><text x="500.0" y="298.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >90</text><text x="600.0" y="298.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text><text x="78.0" y="318.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >C₈₀</text><text x="250.0" y="318.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >30</text><text x="340.0" y="318.0" font-size="10" fill="#0E8A7B" text-anchor="middle" font-weight="800" >12</text><text x="420.0" y="318.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >80</text><text x="500.0" y="318.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >120</text><text x="600.0" y="318.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text><text x="78.0" y="338.0" font-size="9.2" fill="#1B2A4A" text-anchor="start" font-weight="400" >C₁₄₀</text><text x="250.0" y="338.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >60</text><text x="340.0" y="338.0" font-size="10" fill="#0E8A7B" text-anchor="middle" font-weight="800" >12</text><text x="420.0" y="338.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >140</text><text x="500.0" y="338.0" font-size="9.4" fill="#5A6779" text-anchor="middle" font-weight="400" >210</text><text x="600.0" y="338.0" font-size="9.6" fill="#0E8A7B" text-anchor="middle" font-weight="800" >2</text></svg>