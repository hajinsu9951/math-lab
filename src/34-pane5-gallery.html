<!-- ================= PANE 5 ================= -->
<section class="pane" id="p5"><div class="wrap">
  <h2 class="sec">우리 연수 모음집 — 선생님들이 만든 자료 모으기</h2>
  <p class="sub">각자 만든 HTML 자료를 여기에 올리면 한자리에 모입니다. 갤러리 워크에서 서로 조작해 보고,
  마지막에 <b>모음집 파일 하나로 묶어</b> 전원에게 배포합니다.</p>

  <div class="upwrap">
    <div class="drop" id="drop">
      <div class="dropin">
        <b>여기에 HTML 파일을 끌어다 놓으세요</b>
        <span>또는 아래 버튼으로 고르세요 · 여러 개 한꺼번에 됩니다</span>
        <input type="file" id="file" accept=".html,.htm" multiple hidden>
        <button class="b" id="pick">파일 고르기</button>
      </div>
    </div>
    <div class="upmeta">
      <label class="ctl">올리는 사람 <input type="text" id="who" placeholder="예) 대전대신고 하진수" maxlength="30"></label>
      <label class="ctl">한 줄 소개 <input type="text" id="memo" placeholder="예) 삼각비로 학교 건물 높이 재기" maxlength="60"></label>
      <p class="upnote"><b>서버에 올라가지 않습니다.</b> 파일은 이 브라우저 안에서만 열립니다.
      새로고침하면 사라지니, 연수 마무리에 반드시 <b>모음집 내려받기</b>를 하세요.</p>
    </div>
  </div>

  <div class="gbar">
    <div class="gcount" id="gcount">아직 올라온 자료가 없습니다.</div>
    <div class="btns">
      <button class="b t" id="gExport">모음집 내려받기 (HTML 하나)</button>
      <button class="b g" id="gClear">전체 비우기</button>
    </div>
  </div>

  <div class="glist" id="glist"></div>

  <div class="gpv" id="gpv" style="display:none">
    <div class="pvhead"><h4 id="gpvT"></h4><button class="b g sm" id="gpvX">닫기</button></div>
    <iframe class="pv" id="gpvF"></iframe>
  </div>
</div></section>
