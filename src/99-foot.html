   · #lab=N  → LAB N 을 연다 (N 은 카드에 적힌 번호, 1부터)
   · #tab=p2 → 탭을 바꾼다 (p1 실험실 · p2 바이브 코딩 · p3 운영 흐름 · p4 수업·평가 · p5 모음집)

(function(){
  function parse(){
    var h=(location.hash||'').replace(/^#/,''); var o={};
    h.split('&').forEach(function(kv){ var m=kv.split('='); if(m[0]) o[decodeURIComponent(m[0])]=decodeURIComponent(m[1]||''); });
    return o;
  }
  function apply(){
    var o=parse();
    if(o.tab){ var b=document.querySelector('nav.tabs button[data-p="'+o.tab+'"]'); if(b) b.click(); }
    if(o.lab){ var n=parseInt(o.lab,10);

        setTimeout(function(){ openLab(n-1); var t=document.getElementById('mTitle'); if(t) t.scrollIntoView({block:'start'}); }, 60);
      }
    }
  }

  if(document.readyState==='complete') apply(); else window.addEventListener('load', apply);
})();

<script>
(function(){
  /* ① 예상·실험·기록 단계에 ① 문제를 다시 싣는다.
        문구는 그 실험실의 ① 문제 단계(.lsnph[data-ph="0"])에서 그대로 읽어 온다 —
        같은 말을 두 곳에 적지 않기 위해서다. */
  function recap(flow){
    var p0 = flow.querySelector('.lsnph[data-ph="0"]');
    if(!p0) return;
    var q = p0.querySelector('.lsnq'), s = p0.querySelector('.lsnsit');
    if(!q) return;
    ['1','2','3'].forEach(function(i){
      var ph = flow.querySelector('.lsnph[data-ph="'+i+'"]');
      if(!ph || ph.querySelector('.lsnrc')) return;
      var d = document.createElement('details');
      d.className = 'lsnrc'; d.open = true;
      d.innerHTML = '<summary>📌 다시 보는 오늘의 문제</summary>'
        + '<p class="q">' + q.innerHTML + '</p>'
        + (s ? '<div class="s">' + s.innerHTML + '</div>' : '');
      ph.insertBefore(d, ph.firstChild);
    });
  }

  /* ② 빈 칸 앞에서 막히지 않도록 쓸 것을 번호로 일러 준다.
        어떤 칸인지는 그 칸이 놓인 단계의 머리글을 보고 고른다. */
  var HINT = {
    예상: '이렇게 쓰면 됩니다 — <b>①</b> 예상한 답을 수·식·그림 가운데 하나로 '
        + '<b>②</b> 그렇게 본 까닭을 한 줄 <b>③</b> 실험에서 확인할 것 한 가지. '
        + '틀려도 됩니다 — 실험한 뒤 빨간 펜으로 고쳐 쓰는 것이 이 칸의 목적입니다.',
    원리: '이렇게 쓰면 됩니다 — <b>①</b> 실험에서 찾은 규칙을 <b>내 말로 한 문장</b> '
        + '<b>②</b> 같은 규칙을 <b>식으로 한 줄</b> <b>③</b> 그 식이 맞다고 본 근거(화면에서 읽은 수)를 하나.',
    보고서: '위 세 물음에 차례로 답하세요 — <b>①</b> 표에서 <b>본 것</b>(수치 그대로) '
        + '<b>②</b> 거기서 찾은 <b>규칙</b>(말 또는 식) <b>③</b> 왜 그런지 <b>설명</b>과, 값을 바꿔도 통하는지.'
  };
  function hint(pad){
    if(pad.querySelector('.wphint')) return;
    var host = pad.closest('.lsnph, .iqb, .plock, .pgmemo, section, div');
    var txt = (host && host.innerText || '').slice(0, 200);
    var key = /원리|설명/.test(txt) ? '원리' : /보고서|기록/.test(txt) ? '보고서' : '예상';
    var head = pad.querySelector('.wph');
    if(!head) return;
    var p = document.createElement('p');
    p.className = 'wphint'; p.innerHTML = HINT[key];
    head.parentNode.insertBefore(p, head.nextSibling);
  }


  /* ③ 탐구 사다리의 「이렇게」·「손으로」 줄에 정답 식이 그대로 적혀 있었다.
        절차는 남기고 답만 지운다 — 학생이 스스로 세우게 한다. */
  function hideAnswers(root){
    root.querySelectorAll('.ldd, .ldw').forEach(function(el){
      if(el.dataset.masked) return;
      /* 정답을 지우는 정규식이 GPS 전용이라, 같은 실험실에 .lg1wrap 이 있을 때만 쓴다 */
      var lab = el.closest('#lsLab');
      if(!lab || !lab.querySelector('.lg1wrap')) return;
      var h = el.innerHTML;
      var before = h;
      h = h.replace(/\([xX]\s*[−-]\s*\d+\)\s*²\s*\+\s*\([yY]\s*[−-]\s*\d+\)\s*²\s*=\s*\d+/g, '원의 방정식');
      h = h.replace(/\d*\s*[xX]\s*\+\s*\d*\s*[yY]\s*=\s*\d+/g, '직선의 식');
      h = h.replace(/\(\s*5\s*,\s*4\s*\)/g, '친구의 좌표');
      h = h.replace(/정말\s*\d+\s*가\s*되는지/g, '정말 우변 값이 되는지');
      h = h.replace(/[xX]\s*=\s*\d+\s*,\s*[yY]\s*=\s*\d+/g, '해');
      /* 식을 걷어내면 조사가 어긋난다 — 읽히게 다듬는다 */
      h = h.replace(/원의 방정식\s*와\s*원의 방정식\s*를/g, '두 원의 방정식을');
      h = h.replace(/직선의 식\s*와\s*직선의 식\s*를/g, '두 직선의 식을');
      if(h !== before){ el.innerHTML = h; }
      el.dataset.masked = '1';
    });
  }

  /* ④ 「식 확인」을 눌렀을 때 틀린 칸만 붉게 하고 힌트를 준다.
        기대값은 문제에 적힌 기준점과 거리에서 나온다 —
        편의점(1,1) 500 m · 도서관(5,9) 500 m · 학교(9,4) 400 m, 1칸 = 100 m. */
  var WANT = { '①':[1,1,25], '②':[5,9,25], '③':[9,4,16], '④':[1,2,13], '⑤':[8,3,52] };
  var WHY = {
    r2: '우변은 <b>반지름이 아니라 반지름의 제곱</b>입니다. 500 m 는 5칸이니 5² 를 적으세요.',
    c:  '(x − a)² 의 <b>a 는 중심의 x좌표 그대로</b>입니다. 부호를 뒤집지 마세요.',
    ln: '두 원의 식을 <b>빼면</b> x²·y² 이 지워집니다. 남는 x·y 의 계수와 우변을 그대로 적으세요.'
  };
  function num(v){ v = (v||'').trim().replace(/\s/g,''); return v==='' ? null : Number(v); }

  function checkGroup(box){
    /* 이 검사기는 LAB 01(GPS)의 기대값만 알고 있다. 다른 실험실의 노트는 제 검사기를 따로 갖는다. */
    if(!box.closest || !box.closest('.lg1wrap')) return;
    var ins = [].slice.call(box.querySelectorAll('.eqi'));
    if(ins.length < 3) return;
    var label = (box.innerText.match(/[①②③④⑤]/)||[])[0];
    var want = WANT[label];
    if(!want) return;
    var bad = [], got = ins.slice(0,3).map(function(i){ return num(i.value); });
    ins.slice(0,3).forEach(function(inp,k){
      var wrong = got[k] === null || got[k] !== want[k];
      inp.classList.toggle('eqbad', wrong);
      if(wrong) bad.push(k);
    });
    var hint = box.querySelector('.eqhint');
    if(!hint){ hint = document.createElement('p'); hint.className='eqhint'; box.appendChild(hint); }
    if(!bad.length){
      hint.className = 'eqhint ok';
      hint.innerHTML = '맞습니다 — 다음 칸으로 가세요.';
      return;
    }
    hint.className = 'eqhint';
    var msg;
    if(label === '④' || label === '⑤') msg = WHY.ln;
    else if(bad.indexOf(2) >= 0 && got[2] !== null && Math.abs(got[2]*got[2] - want[2]) < 1e-9) msg = WHY.r2;
    else if(bad.indexOf(2) >= 0) msg = WHY.r2;
    else msg = WHY.c;
    var names = bad.map(function(k){ return ['첫째','둘째','셋째'][k]; }).join('·');
    hint.innerHTML = '<b>' + names + ' 칸</b>을 다시 보세요. ' + msg;
  }

  function wireChecks(root){
    root.querySelectorAll('.lg1wrap .eqk, .lg1wrap .lnk, .lg1wrap .slk').forEach(function(btn){
      if(btn.dataset.wired) return;
      btn.dataset.wired = '1';
      btn.addEventListener('click', function(){
        var box = btn.closest('div');
        for(var i=0; i<4 && box && box.querySelectorAll('.eqi').length < 3; i++) box = box.parentElement;
        if(box) setTimeout(function(){ checkGroup(box); }, 0);
      });
    });
  }

  function sweep(){
    document.querySelectorAll('.lsn').forEach(recap);
    document.querySelectorAll('.wpb').forEach(hint);
    hideAnswers(document);
    wireChecks(document);
  }
  new MutationObserver(sweep).observe(document.body, {childList:true, subtree:true});
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', sweep);
  else sweep();
})();
</script>

/* ① 모달(#mask)이 열리면 뒤 페이지를 그 자리에 세우고, 닫으면 보던 자리로 돌려놓는다.

(function(){

  if(!mask) return;
  var y = 0, locked = false;
  var phone = function(){ return window.matchMedia('(max-width:940px)').matches; };
  function lock(){
    if(locked || !phone()) return;
    y = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = (-y) + 'px';
    document.body.classList.add('mlock');

  }
  function unlock(){

  }
  new MutationObserver(function(){
    mask.classList.contains('on') ? lock() : unlock();
  }).observe(mask, {attributes:true, attributeFilter:['class']});
})();

function wsPages(blocks, pageH){

      if(!c) c = lim;

  const W = '595.28', H = '841.89';

  off[1] = pos; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2] = pos; put('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,k)=>(4+k*3)+' 0 R').join(' ')+'] /Count '+pages.length+' >>\nendobj\n');
  off[3] = pos; put('3 0 obj\n<< /Title '+hex16(title||'')+' /Producer (math-lab worksheet) >>\nendobj\n');
  pages.forEach((p,k)=>{
    const pg = 4+k*3, ct = pg+1, im = pg+2;
    const cs = 'q\n'+W+' 0 0 '+H+' 0 0 cm\n/Im'+k+' Do\nQ';
    off[pg] = pos; put(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im'+k+' '+im+' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents '+ct+' 0 R >>\nendobj\n');
    off[ct] = pos; put(ct+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    off[im] = pos; put(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');
    put(p.jpg); put('\nendstream\nendobj\n');
  });
  const xref = pos;
  let x = 'xref\n0 '+N+'\n0000000000 65535 f \n';
  for(let i=1;i<N;i++) x += String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<< /Size '+N+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');

}
function wsSave(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[\\/:*?"<>|]/g,''); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
/* 활동지 HTML → PDF 파일. 실패하면 throw — 부르는 쪽이 인쇄 창으로 물러선다. */
async function wsPdf(html, name){
  const A = WS_A4, CW = A.w - 2*A.m, SC = A.sc;
  const f = await wsFrame(html, CW);
  try{
    const d = f.contentDocument, w = f.contentWindow;
    if(!d || !d.body) throw new Error('활동지 틀을 열지 못함');
    const fit = d.createElement('style');
    fit.textContent = 'html,body{margin:0;padding:0;background:#fff}.wrap{max-width:none!important;margin:0!important;padding:0!important;display:flow-root}';
    d.head.appendChild(fit);
    await Promise.all([].map.call(d.images, im=>im.decode ? im.decode().catch(()=>{}) : null));
    if(d.fonts && d.fonts.ready) await d.fonts.ready;
    const wrap = d.querySelector('.wrap') || d.body;
    const r0 = wrap.getBoundingClientRect(), top0 = r0.top, W = Math.ceil(r0.width);
    /* 그림 크기를 못 박아 둔다 — 쪽 밖의 그림을 빈 그림으로 바꿔도 자리가 그대로이게 */
    const imgs = [].slice.call(wrap.querySelectorAll('img'));
    const ibox = imgs.map(im=>{ const r = im.getBoundingClientRect();
      im.style.width = r.width+'px'; im.style.height = r.height+'px'; im.style.maxWidth = 'none'; im.style.maxHeight = 'none';
      return {t:r.top-top0, b:r.bottom-top0}; });
    const blocks = [].map.call(wrap.children, el=>{
      const r = el.getBoundingClientRect(), cuts = [];
      el.querySelectorAll('li,tr,p,figure,.fig,.fig2,.box,.ln i,h2,div').forEach(c=>{ const b = c.getBoundingClientRect().bottom - top0; if(b > 0) cuts.push(b); });
      return {t:r.top-top0, b:r.bottom-top0, cuts};
    });
    const pageH = (A.h - 2*A.m) * WS_PX;
    const pages = wsPages(blocks, pageH);
    if(!pages.length) throw new Error('쪽이 없음');
    /* body 에 걸린 글꼴·줄 간격을 그대로 물려받게 body 규칙을 뿌리 상자(.wsbody)로 옮긴다.
       계산값(px)을 복사하면 line-height 1.6 이 고정 px 로 굳어 작은 글씨 줄이 늘어나고, 쪽 나눔이 어긋난다. */
    const css = [].map.call(d.querySelectorAll('style'), s=>s.textContent).join('\n')
                  .replace(/(^|[\s,{}])body(?=[\s,{.:#\[])/g, '$1.wsbody');
    const xs = new XMLSerializer();
    const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const out = [];
    for(let k=0;k<pages.length;k++){
      const s = pages[k][0], e = pages[k][1], h = Math.ceil(e - s) + 1;
      const root = d.createElement('div');
      root.setAttribute('class', 'wsbody');
      root.setAttribute('style', 'width:'+W+'px;height:'+h+'px;overflow:hidden;position:relative;background:#fff;margin:0');
      const st = d.createElement('style'); st.textContent = css; root.appendChild(st);
      const cl = wrap.cloneNode(true);
      cl.style.position = 'absolute'; cl.style.left = '0'; cl.style.top = (-s)+'px'; cl.style.width = W+'px'; cl.style.margin = '0';
      [].forEach.call(cl.querySelectorAll('img'), (im,i)=>{ const b = ibox[i]; if(b && (b.b < s || b.t > e)) im.setAttribute('src', BLANK); });
      root.appendChild(cl);
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(W*SC)+'" height="'+(h*SC)+'" viewBox="0 0 '+W+' '+h+'">'
        + '<foreignObject x="0" y="0" width="'+W+'" height="'+h+'">'+xs.serializeToString(root)+'</foreignObject></svg>';
      const im = await wsLoadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
      const cv = document.createElement('canvas');
      cv.width = Math.round(A.w*WS_PX*SC); cv.height = Math.round(A.h*WS_PX*SC);
      const c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0,0,cv.width,cv.height);
      const mx = Math.round(A.m*WS_PX*SC);
      c.drawImage(im, mx, mx, W*SC, h*SC);
      if(k === 0){                                    // 아무것도 안 그려졌으면(foreignObject 미지원) 물러선다
        const t = document.createElement('canvas'); t.width = 60; t.height = 85;
        const tc = t.getContext('2d'); tc.drawImage(cv, 0, 0, 60, 85);
        const px = tc.getImageData(0,0,60,85).data; let ink = 0;   // 오염됐으면 여기서 SecurityError
        for(let i=0;i<px.length;i+=4) if(px[i]+px[i+1]+px[i+2] < 600) ink++;
        if(ink < 8) throw new Error('빈 쪽 — foreignObject 미지원');
      }
      c.fillStyle = '#9CA3AF'; c.font = (9*SC)+'px "Malgun Gothic","맑은 고딕",sans-serif'; c.textAlign = 'center';
      c.fillText((k+1)+' / '+pages.length, cv.width/2, cv.height - Math.round(5*WS_PX*SC));
      out.push({jpg: await wsJpeg(cv, 0.9), w: cv.width, h: cv.height});
    }
    wsSave(wsPdfBytes(out, d.title || name), name);
    return {pages: out.length};
  } finally { f.remove(); }
}
/* 대체 경로 — 숨긴 iframe 의 print() 로 인쇄 창을 띄운다 */
function wsPrint(html){
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.onload = ()=>setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){}
    setTimeout(()=>f.remove(), 60000); }, 250);
  f.srcdoc = html; document.body.appendChild(f);
}

function addBtn(){

  };
}
